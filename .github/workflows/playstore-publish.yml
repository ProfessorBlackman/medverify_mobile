# Publishes MedVerify to the Google Play Store (internal testing track).
#
# - push to master: builds, tests, then uploads a new build to Play Console.
# - pull_request into master: builds and tests only (no upload) so signing/build
#   issues surface before merge without shipping unreviewed code to Play.
#
# Required secrets (in addition to the ones already used by release.yml/ci.yml):
#   PLAY_STORE_SERVICE_ACCOUNT_JSON  - raw JSON of a Play Console service account
#                                      with "Release to testing tracks" permission
name: Publish to Play Store

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: playstore-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Verify App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Write google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode \
            > android/app/google-services.json

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode \
            > android/app/medverify-release.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=medverify-release.jks
          EOF

      - name: Determine version
        id: version
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          VERSION_CODE=${{ github.run_number }}
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Build release App Bundle
        run: |
          flutter build appbundle --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: medverify-v${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  publish:
    name: Publish to Play Console (internal track)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Download App Bundle artifact
        uses: actions/download-artifact@v4
        with:
          pattern: medverify-v*
          path: release
          merge-multiple: true

      - name: Upload to Google Play (internal testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.tlc.medverify_mobile
          releaseFiles: release/app-release.aab
          track: internal
          status: completed
